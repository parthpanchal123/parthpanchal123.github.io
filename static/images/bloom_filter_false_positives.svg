<path class="arrow-dashed" d="M230 420 L132 304" marker-end="url(#arrow)"/>
<path class="arrow-dashed" d="M275 420 L280 304" marker-end="url(#arrow)"/>
<path class="arrow-dashed" d="M320 420 L465 304" marker-end="url(#arrow)"/>

<!-- False positive result -->
<rect class="result-amber" x="386" y="424" width="218" height="28" rx="6"/>
<text x="495" y="438" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#633806">All 3 bits = 1 → "maybe" (false positive!)</text>

<!-- ══ LEGEND ══ -->
<rect x="40"  y="500" width="12" height="12" rx="2" fill="#5DCAA5"/>
<text class="label-sm" x="58"  y="510" dominant-baseline="central">Bits set by true member</text>
<rect x="270" y="500" width="12" height="12" rx="2" fill="#F0997B"/>
<text class="label-sm" x="288" y="510" dominant-baseline="central">Bits set by other items (collision)</text>
<rect x="508" y="500" width="12" height="12" rx="2" fill="#B4B2A9"/>
<text class="label-sm" x="526" y="510" dominant-baseline="central">Query (not a member)</text>

</svg>
