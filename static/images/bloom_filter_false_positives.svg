<svg width="100%" viewBox="0 0 680 540" xmlns="http://www.w3.org/2000/svg" style="font-family: system-ui, sans-serif;">
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
  <style>
    .label-primary { font-size: 13px; font-weight: 600; fill: #1a1a1a; }
    .label-sm      { font-size: 12px; font-weight: 400; fill: #555; }
    .label-sm-bold { font-size: 12px; font-weight: 600; fill: #1a1a1a; }
    .cell-zero     { fill: #f5f5f3; stroke: #ccc; stroke-width: 0.5; }
    .cell-teal     { fill: #5DCAA5; stroke: #1D9E75; stroke-width: 0.5; }
    .cell-coral    { fill: #F0997B; stroke: #D85A30; stroke-width: 0.5; }
    .cell-amber    { fill: #EF9F27; stroke: #BA7517; stroke-width: 0.5; }
    .cell-purple   { fill: #AFA9EC; stroke: #534AB7; stroke-width: 0.5; }
    .text-on-teal  { fill: #085041; }
    .text-on-coral { fill: #712B13; }
    .text-on-amber { fill: #633806; }
    .text-on-purple{ fill: #26215C; }
    .item-teal     { fill: #E1F5EE; stroke: #1D9E75; stroke-width: 0.5; }
    .item-coral    { fill: #FAECE7; stroke: #D85A30; stroke-width: 0.5; }
    .item-amber    { fill: #FAEEDA; stroke: #BA7517; stroke-width: 0.5; }
    .item-purple   { fill: #EEEDFE; stroke: #534AB7; stroke-width: 0.5; }
    .item-gray     { fill: #F1EFE8; stroke: #888780; stroke-width: 0.5; }
    .arrow-teal    { stroke: #1D9E75; fill: none; stroke-width: 1.2; }
    .arrow-coral   { stroke: #D85A30; fill: none; stroke-width: 1.2; }
    .arrow-amber   { stroke: #BA7517; fill: none; stroke-width: 1.2; }
    .arrow-purple  { stroke: #534AB7; fill: none; stroke-width: 1.2; }
    .arrow-dashed  { stroke: #888; fill: none; stroke-width: 1; stroke-dasharray: 4 3; }
    .result-amber  { fill: #FAEEDA; stroke: #BA7517; stroke-width: 0.5; }
    .result-teal   { fill: #E1F5EE; stroke: #1D9E75; stroke-width: 0.5; }
    .divider       { stroke: #ccc; stroke-width: 0.5; stroke-dasharray: 4 4; fill: none; }
    .legend-box    { stroke-width: 0; rx: 2; }
  </style>
</defs>

<!-- ══ PANEL A ══ -->
<text class="label-primary" x="40" y="30">A. Adding "Amul Ghee" — three bits are set</text>

<!-- Bit array shell -->
<rect x="40" y="48" width="600" height="46" rx="6" fill="#f9f9f7" stroke="#ccc" stroke-width="0.5"/>

<!-- Cells 0–15  (width=37 each except last=45) -->
<rect class="cell-zero"  x="40"  y="48" width="37" height="46"/>
<rect class="cell-zero"  x="77"  y="48" width="37" height="46"/>
<rect class="cell-teal"  x="114" y="48" width="37" height="46"/>
<rect class="cell-zero"  x="151" y="48" width="37" height="46"/>
<rect class="cell-zero"  x="188" y="48" width="37" height="46"/>
<rect class="cell-zero"  x="225" y="48" width="37" height="46"/>
<rect class="cell-teal"  x="262" y="48" width="37" height="46"/>
<rect class="cell-zero"  x="299" y="48" width="37" height="46"/>
<rect class="cell-zero"  x="336" y="48" width="37" height="46"/>
<rect class="cell-zero"  x="373" y="48" width="37" height="46"/>
<rect class="cell-zero"  x="410" y="48" width="37" height="46"/>
