<text class="label-sm" x="576" y="106" text-anchor="middle">14</text>
<text class="label-sm" x="617" y="106" text-anchor="middle">15</text>

<!-- Item box -->
<rect class="item-teal" x="248" y="148" width="144" height="36" rx="8"/>
<text x="320" y="166" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" fill="#085041">add("Amul Ghee")</text>

<!-- Arrows to bits 2, 6, 11 -->
<path class="arrow-teal" d="M285 148 L132 96" marker-end="url(#arrow)"/>
<path class="arrow-teal" d="M320 148 L280 96" marker-end="url(#arrow)"/>
<path class="arrow-teal" d="M355 148 L465 96" marker-end="url(#arrow)"/>

<!-- Hash labels -->
<text class="label-sm" x="192" y="130">h₁ → 2</text>
<text class="label-sm" x="288" y="138">h₂ → 6</text>
<text class="label-sm" x="388" y="130">h₃ → 11</text>

<!-- Result pill -->
<rect class="result-teal" x="452" y="152" width="188" height="28" rx="6"/>
<text x="546" y="166" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#085041">Definite YES — all 3 bits are 1</text>

<!-- ══ DIVIDER ══ -->
<line class="divider" x1="40" y1="210" x2="640" y2="210"/>

<!-- ══ PANEL B ══ -->
<text class="label-primary" x="40" y="238">B. False positive — three different items accidentally set the same bits</text>

<!-- Bit array shell B -->
<rect x="40" y="256" width="600" height="46" rx="6" fill="#f9f9f7" stroke="#ccc" stroke-width="0.5"/>

<!-- Cells B -->
<rect class="cell-zero"   x="40"  y="256" width="37" height="46"/>
<rect class="cell-zero"   x="77"  y="256" width="37" height="46"/>
<rect class="cell-coral"  x="114" y="256" width="37" height="46"/>
