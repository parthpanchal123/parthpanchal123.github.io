<rect class="cell-zero"  x="558" y="48" width="37" height="46"/>
<rect class="cell-zero"  x="595" y="48" width="45" height="46"/>

<!-- Bit values -->
<text class="label-sm"      x="58"  y="75" text-anchor="middle" dominant-baseline="central">0</text>
<text class="label-sm"      x="95"  y="75" text-anchor="middle" dominant-baseline="central">0</text>
<text class="label-sm-bold text-on-teal" x="132" y="75" text-anchor="middle" dominant-baseline="central" fill="#085041" font-weight="700">1</text>
<text class="label-sm"      x="169" y="75" text-anchor="middle" dominant-baseline="central">0</text>
<text class="label-sm"      x="206" y="75" text-anchor="middle" dominant-baseline="central">0</text>
<text class="label-sm"      x="243" y="75" text-anchor="middle" dominant-baseline="central">0</text>
<text class="label-sm-bold" x="280" y="75" text-anchor="middle" dominant-baseline="central" fill="#085041" font-weight="700">1</text>
<text class="label-sm"      x="317" y="75" text-anchor="middle" dominant-baseline="central">0</text>
<text class="label-sm"      x="354" y="75" text-anchor="middle" dominant-baseline="central">0</text>
<text class="label-sm"      x="391" y="75" text-anchor="middle" dominant-baseline="central">0</text>
<text class="label-sm"      x="428" y="75" text-anchor="middle" dominant-baseline="central">0</text>
<text class="label-sm-bold" x="465" y="75" text-anchor="middle" dominant-baseline="central" fill="#085041" font-weight="700">1</text>
<text class="label-sm"      x="502" y="75" text-anchor="middle" dominant-baseline="central">0</text>
<text class="label-sm"      x="539" y="75" text-anchor="middle" dominant-baseline="central">0</text>
<text class="label-sm"      x="576" y="75" text-anchor="middle" dominant-baseline="central">0</text>
<text class="label-sm"      x="617" y="75" text-anchor="middle" dominant-baseline="central">0</text>

<!-- Index labels -->
<text class="label-sm" x="58"  y="106" text-anchor="middle">0</text>
<text class="label-sm" x="95"  y="106" text-anchor="middle">1</text>
<text class="label-sm" x="132" y="106" text-anchor="middle" font-weight="600">2</text>
<text class="label-sm" x="169" y="106" text-anchor="middle">3</text>
<text class="label-sm" x="206" y="106" text-anchor="middle">4</text>
<text class="label-sm" x="243" y="106" text-anchor="middle">5</text>
<text class="label-sm" x="280" y="106" text-anchor="middle" font-weight="600">6</text>
<text class="label-sm" x="317" y="106" text-anchor="middle">7</text>
<text class="label-sm" x="354" y="106" text-anchor="middle">8</text>
<text class="label-sm" x="391" y="106" text-anchor="middle">9</text>
<text class="label-sm" x="428" y="106" text-anchor="middle">10</text>
<text class="label-sm" x="465" y="106" text-anchor="middle" font-weight="600">11</text>
