<rect class="cell-zero"   x="558" y="256" width="37" height="46"/>
<rect class="cell-zero"   x="595" y="256" width="45" height="46"/>

<!-- Bit values B -->
<text class="label-sm"      x="58"  y="283" text-anchor="middle" dominant-baseline="central">0</text>
<text class="label-sm"      x="95"  y="283" text-anchor="middle" dominant-baseline="central">0</text>
<text class="label-sm-bold" x="132" y="283" text-anchor="middle" dominant-baseline="central" fill="#712B13" font-weight="700">1</text>
<text class="label-sm"      x="169" y="283" text-anchor="middle" dominant-baseline="central">0</text>
<text class="label-sm"      x="206" y="283" text-anchor="middle" dominant-baseline="central">0</text>
<text class="label-sm"      x="243" y="283" text-anchor="middle" dominant-baseline="central">0</text>
<text class="label-sm-bold" x="280" y="283" text-anchor="middle" dominant-baseline="central" fill="#633806" font-weight="700">1</text>
<text class="label-sm"      x="317" y="283" text-anchor="middle" dominant-baseline="central">0</text>
<text class="label-sm"      x="354" y="283" text-anchor="middle" dominant-baseline="central">0</text>
<text class="label-sm"      x="391" y="283" text-anchor="middle" dominant-baseline="central">0</text>
<text class="label-sm"      x="428" y="283" text-anchor="middle" dominant-baseline="central">0</text>
<text class="label-sm-bold" x="465" y="283" text-anchor="middle" dominant-baseline="central" fill="#26215C" font-weight="700">1</text>
<text class="label-sm"      x="502" y="283" text-anchor="middle" dominant-baseline="central">0</text>
<text class="label-sm"      x="539" y="283" text-anchor="middle" dominant-baseline="central">0</text>
<text class="label-sm"      x="576" y="283" text-anchor="middle" dominant-baseline="central">0</text>
<text class="label-sm"      x="617" y="283" text-anchor="middle" dominant-baseline="central">0</text>

<!-- Index labels B (only the 3 that matter) -->
<text class="label-sm" x="132" y="314" text-anchor="middle" font-weight="600">2</text>
<text class="label-sm" x="280" y="314" text-anchor="middle" font-weight="600">6</text>
<text class="label-sm" x="465" y="314" text-anchor="middle" font-weight="600">11</text>

<!-- Three culprit items -->
<rect class="item-coral"  x="56"  y="346" width="120" height="36" rx="8"/>
<text x="116" y="364" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" fill="#712B13">add("Parle-G")</text>

<rect class="item-amber"  x="260" y="346" width="120" height="36" rx="8"/>
<text x="320" y="364" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" fill="#633806">add("Papad")</text>

<rect class="item-purple" x="462" y="346" width="124" height="36" rx="8"/>
<text x="524" y="364" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" fill="#26215C">add("Dettol")</text>

<!-- Arrows from items to bits -->
<path class="arrow-coral"  d="M130 346 L132 304" marker-end="url(#arrow)"/>
<path class="arrow-amber"  d="M320 346 L280 304" marker-end="url(#arrow)"/>
<path class="arrow-purple" d="M524 346 L465 304" marker-end="url(#arrow)"/>

<!-- Query -->
<rect class="item-gray" x="190" y="420" width="170" height="36" rx="8"/>
<text x="275" y="438" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" fill="#3d3d3a">check("Saffola Oil")</text>

