baseURL: "https://parthpanchal123.github.io/"
title: Parth's Blog
theme: PaperMod

enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false

minify:
  disableXML: true
  minifyOutput: true

outputs:
  home:
    - HTML
    - RSS
    - JSON # Required for search functionality

taxonomies:
  tag: tags
  category: categories

services:
  googleAnalytics:
    id: "G-0ZX5VN6NME"

params:
  env: production # to enable google analytics, opengraph, twitter-cards and schema.
  title: Parth's Blog
  description: "Processing the world through 0s and 1s, wide-aperture lenses, and graphite strokes. 🧬 Parth Panchal: Documenting life via clean code, street photography, and creative art."
  keywords: [Blog, Portfolio, PaperMod, ]
  googleSiteVerification: "G-0ZX5VN6NME"
  author: "Parth Panchal"
  images: ["images/profile.png"]
  DateFormat: "January 2, 2006"
  defaultTheme: auto
  disableThemeToggle: false
  ShowReadingTime: true
  ShowShareButtons: false
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowWordCount: false
  ShowRssButtonInSectionTermList: true
  UseHugoToc: true
  disableSpecial1stPost: false
  disableScrollToTop: false
  comments: true
  hidemeta: false
  hideSummary: false
  showtoc: true
  tocopen: false

  assets:
    favicon: "/favicon.ico"
    favicon16x16: "/favicon-16x16.png"
    favicon32x32: "/favicon-32x32.png"
    apple_touch_icon: "/apple-touch-icon.png"

  label:
    text: "Parth's Blog"

  # profile-mode
  profileMode:
    enabled: false # needs to be explicitly set
    title: ExampleSite
    subtitle: "This is subtitle"
    imageUrl: "<img location>"
    imageWidth: 120
    imageHeight: 120
    imageTitle: my image
    buttons:
      - name: Posts
        url: posts
      - name: Tags
        url: tags

  # home-info mode
  homeInfoParams:
    Title: "Hi there 👋, I'm Parth"
    Content: |
      #### An Engineer during the week, artist by the weekend.
      Welcome to my personal archive of **_tech_**, **_art_**, and **_photography_**.

  socialIcons:
    - name: github
      url: "https://github.com/parthpanchal123"
    - name: x
      url: "https://x.com/im_parth_24"
    - name: linkedin
      url: "https://www.linkedin.com/in/parthpanchal123/"
    - name: email
      url: "mailTo:parthpanchal53@gmail.com"

  analytics:
    google:
      SiteVerificationTag: "G-0ZX5VN6NME"

  cover:
    hidden: false
    hiddenInList: false
    hiddenInSingle: false

  # editPost:
  #   URL: "https://github.com/<path_to_repo>/content"
  #   Text: "Suggest Changes" # edit text
  #   appendFilePath: true # to append file path to Edit link

  # for search
  # https://fusejs.io/api/options.html
  fuseOpts:
    isCaseSensitive: false
    shouldSort: true
    location: 0
    distance: 1000
    threshold: 0.4
    minMatchCharLength: 2
    minmatchcharlength: 2
    ignoreLocation: true
    limit: 10 # refer:
    keys: ["title", "permalink", "summary", "content"]

menu:
  main:
    - identifier: blog
      name: Tech Blog
      url: /blog/
      weight: 10
    - identifier: photography
      name: Photography
      url: /gallery/
      weight: 20
    - identifier: sketches
      name: Art Sketches
      url: /sketches/
      weight: 30
    - identifier: tags
      name: Tags
      url: /tags/
      weight: 40
    - identifier: search
      name: Search
      url: /search/
      weight: 50
    - identifier: about
      name: About Parth
      url: /about/
      weight: 60

pygmentsUseClasses: true
markup:
  highlight:
    noClasses: false
