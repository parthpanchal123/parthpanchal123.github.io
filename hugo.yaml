baseURL: "https://parthpanchal123.github.io/"
title: "Parth's Blog"
theme: PaperMod

# --- Core Hugo Settings ---
enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false
enableEmoji: true

# --- Asset Optimization ---
minify:
  disableXML: false    # Changed to false so your sitemap is minified too
  minifyOutput: true
  tdewolff:
    minifyCSS: true
    minifyJS: true

outputs:
  home:
    - HTML
    - RSS
    - JSON # Required for Search functionality

taxonomies:
  tag: tags
  category: categories

# --- Analytics ---
services:
  googleAnalytics:
    id: "G-LR4GLM96VJ"

privacy:
  googleAnalytics:
    anonymizeIP: true
    disableTracking: false
    usePrivacyProxy: false

# --- PaperMod Parameters ---
params:
  env: production 
  title: "Parth's Blog"
  description: "Systems Engineer, Photographer, and Artist. Documenting life via clean code, street photography, and creative art."
  keywords: [Blog, Portfolio, PaperMod, Tech, Photography, Art]
  author: "Parth Panchal"
  images: ["images/og-fallback.png"]
  DateFormat: "January 2, 2006"
  defaultTheme: auto
  disableThemeToggle: false
  
  # UI Features
  ShowReadingTime: true
  ShowShareButtons: false
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowWordCount: false
  ShowRssButtonInSectionTermList: true
  UseHugoToc: true
  showtoc: true
  tocopen: false
  
  # Assets
  assets:
    favicon: "/favicon.ico"
    favicon16x16: "/favicon-16x16.png"
    favicon32x32: "/favicon-32x32.png"
    apple_touch_icon: "/apple-touch-icon.png"

  label:
    text: "Parth's Blog"

  # Home-Info Mode (Active)
  homeInfoParams:
    Title: "Hi there 👋, I'm Parth"
    Content: |
      #### An Engineer during the week, artist by the weekend.
      Welcome to my personal archive of **_tech_**, **_art_**, and **_photography_**.

  # Social Icons
  socialIcons:
    - name: github
      url: "https://github.com/parthpanchal123"
    - name: x
      url: "https://x.com/im_parth_24"
    - name: linkedin
      url: "https://www.linkedin.com/in/parthpanchal123/"
    - name: email
      url: "mailto:parthpanchal53@gmail.com"

  # Post Settings
  cover:
    hidden: false
    hiddenInList: false
    hiddenInSingle: false

  # Search Logic (Fuse.js)
  fuseOpts:
    isCaseSensitive: false
    shouldSort: true
    location: 0
    distance: 1000
    threshold: 0.4
    minMatchCharLength: 2
    ignoreLocation: true
    limit: 10
    keys: ["title", "permalink", "summary", "content"]

# --- Navigation Menu ---
menu:
  main:
    - identifier: blog
      name: Tech Blog
      pre: '<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="feather feather-terminal"><polyline points="4 17 9 12 4 7"></polyline><line x1="12" y1="19" x2="20" y2="19"></line></svg>'
      url: /blog/
      weight: 10
    - identifier: photography
      name: Photography
      pre: '<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="feather feather-camera"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path><circle cx="12" cy="13" r="4"></circle></svg>'
      url: /gallery/
      weight: 20
    - identifier: sketches
      name: Art Sketches
      pre: '<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="feather feather-feather"><path d="M20.24 12.24a6 6 0 0 0-8.49-8.49L5 10.5V19h8.5z"></path><line x1="16" y1="8" x2="2" y2="22"></line><line x1="17.5" y1="15" x2="9" y2="15"></line></svg>'
      url: /sketches/
      weight: 30
    - identifier: tags
      name: Tags
      pre: '<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="feather feather-tag"><path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"></path><line x1="7" y1="7" x2="7.01" y2="7"></line></svg>'
      url: /tags/
      weight: 40
    - identifier: search
      name: Search
      pre: '<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="feather feather-search"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>'
      url: /search/
      weight: 50
    - identifier: about
      name: About Parth
      pre: '<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="feather feather-user"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>'
      url: /about/
