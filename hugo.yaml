baseURL: "https://parthpanchal123.github.io/"
title: Parth's Blog
theme: PaperMod

enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false

minify:
  disableXML: true
  minifyOutput: true

outputs:
  home:
    - HTML
    - RSS
    - JSON # Required for search functionality

taxonomies:
  tag: tags
  category: categories

services:
  googleAnalytics:
    id: "G-0ZX5VN6NME"

params:
  env: production # to enable google analytics, opengraph, twitter-cards and schema.
  title: Parth's Blog
  description: "ExampleSite description"
  keywords: [Blog, Portfolio, PaperMod]
  googleSiteVerification: "G-0ZX5VN6NME"
  author: ""
  # author: ["Me", "You"] # multiple authors
  images: ["<link or path of image for opengraph, twitter-cards>"]
  DateFormat: "January 2, 2006"
  defaultTheme: auto
  disableThemeToggle: false

  ShowReadingTime: true
  ShowShareButtons: false
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: false
  ShowWordCount: false
  ShowRssButtonInSectionTermList: true
  UseHugoToc: true
  disableSpecial1stPost: false
  disableScrollToTop: false
  comments: false
  hidemeta: false
  hideSummary: false
  showtoc: true
  tocopen: false

  assets:
    # disableHLJS: true # to disable highlight.js
    # disableFingerprinting: true
    favicon: "/favicon.ico"
    favicon16x16: "/favicon-16x16.png"
    favicon32x32: "/favicon-32x32.png"
    apple_touch_icon: "/apple-touch-icon.png"

  label:
    text: "Parth's Blog"
    # icon: /favicon.ico
    # iconHeight: 35

  # profile-mode
  profileMode:
    enabled: false # needs to be explicitly set
    title: ExampleSite
    subtitle: "This is subtitle"
    imageUrl: "<img location>"
    imageWidth: 120
    imageHeight: 120
    imageTitle: my image
    buttons:
      - name: Posts
        url: posts
      - name: Tags
        url: tags

  # home-info mode
  homeInfoParams:
    Title: "Hi there 👋, I'm Parth"
    Content: |
      #### An Engineer during the week, artist by the weekend.
      Welcome to my personal archive of **_tech_**, **_art_**, and **_photography_**.

  socialIcons:
    - name: github
      url: "https://github.com/parthpanchal123"
    - name: x
      url: "https://x.com/im_parth_24"
    - name: linkedin
      url: "https://www.linkedin.com/in/parthpanchal123/"
    - name: email
      url: "mailTo:parthpanchal53@gmail.com"

  analytics:
    google:
      SiteVerificationTag: "G-0ZX5VN6NME"

  cover:
    hidden: false # hide everywhere but not in structured data
    hiddenInList: false # hide on list pages and home
    hiddenInSingle: false # hide on single page

  # editPost:
  #   URL: "https://github.com/<path_to_repo>/content"
  #   Text: "Suggest Changes" # edit text
  #   appendFilePath: true # to append file path to Edit link

  # for search
  # https://fusejs.io/api/options.html
  fuseOpts:
    isCaseSensitive: false
    shouldSort: true
    location: 0
    distance: 1000
    threshold: 0.4
    minMatchCharLength: 0
    limit: 10 # refer: https://www.fusejs.io/api/methods.html#search
    keys: ["title", "permalink", "summary", "content"]
menu:
  main:
    - identifier: Blog
      name: My Blog
      url: /blog/
      weight: 1
    - identifier: Search
      name: Search
      url: /search/
      weight: 5
    - identifier: Tags
      name: Tags
      url: /tags/
      weight: 4
    - identifier: About
      name: About
      url: /about/
      weight: 1
    - identifier: My Clicks
      name: My Clicks
      url: /gallery/
      weight: 3
    - identifier: My Sketches
      name: My Sketches
      url: /sketches/
      weight: 4
# Read: https://github.com/adityatelange/hugo-PaperMod/wiki/FAQs#using-hugos-syntax-highlighter-chroma
pygmentsUseClasses: true
markup:
  highlight:
    noClasses: false
    # anchorLineNos: true
    # codeFences: true
    # guessSyntax: true
    # lineNos: true
    # style: monokai
