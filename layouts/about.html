{{- define "main" }}<style>
    .about-socials {
        display: flex;
        gap: 35px;
        /* Wide gap for a clean, non-cramped look */
        align-items: center;
        padding-bottom: 40px;
    }

    /* Apply the gradient to the SVG stroke */
    .gradient-icon {
        width: 26px;
        height: 26px;
        fill: none;
        stroke: url(#profile-gradient);
        /* Links to the gradient definition above */
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
        transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), filter 0.3s ease;
    }

    .about-socials a:hover .gradient-icon {
        transform: scale(1.2) translateY(-5px);
        filter: drop-shadow(0 4px 8px rgba(248, 177, 212, 0.4));
        /* Subtle pink glow */
    }

    @media screen and (max-width: 700px) {
        .about-socials {
            justify-content: center;
        }

        .about-divider {
            margin-left: auto;
            margin-right: auto;
        }
    }
</style>

                <stop offset="50%" style="stop-color:#f8b1d4;" />
                <stop offset="100%" style="stop-color:#b06ab3;" />
