<!-- Sync body top padding with real header height so the fixed header never overlaps content -->
<script>
        (function () {
                function syncHeaderOffset() {
                        var header = document.querySelector('.header');
                        if (!header) return;
                        var h = header.getBoundingClientRect().height;
                        if (!h) return;
                        document.body.style.paddingTop = h + 'px';
                        document.documentElement.style.setProperty('--header-height', h + 'px');
                }

                // Run immediately — header is in DOM before this script
                syncHeaderOffset();

                // Re-run after each paint to catch immediate layout shifts
                requestAnimationFrame(function () {
                        syncHeaderOffset();
                        requestAnimationFrame(syncHeaderOffset);
                });

                // Re-sync after web fonts finish loading (main cause of clipping)
                if (document.fonts && document.fonts.ready) {
                        document.fonts.ready.then(syncHeaderOffset);
                }

                // Re-sync after all resources load
                window.addEventListener('load', syncHeaderOffset);

                // Re-sync on resize / orientation change
                window.addEventListener('resize', syncHeaderOffset);
        })();
</script>

<!-- Marquee animation recovery — resets animation after images load
     Fixes mobile "blank strip" when images load after animation starts -->
<script>
        (function () {
                function fixMarquees() {
                        document.querySelectorAll('.showcase-track').forEach(function (track) {
                                track.style.animation = 'none';
                                track.offsetWidth; /* force reflow so the reset takes effect */
                                track.style.animation = '';
                        });
                }
                /* Recover once all resources are ready */
                if (document.readyState === 'complete') {
                        fixMarquees();
                } else {
                        window.addEventListener('load', fixMarquees);
                }
                /* Also recover if any individual marquee image loads late */
                document.querySelectorAll('.showcase-marquee img').forEach(function (img) {
                        if (!img.complete) {
                                img.addEventListener('load', fixMarquees, { once: true });
                        }
                });
        }());
</script>
