<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap"
	rel="stylesheet">

<meta property="og:type" content="{{ if .IsPage }}article{{ else }}website{{ end }}">
<meta property="og:url" content="{{ .Permalink }}">
<meta property="og:title" content="{{ if .IsHome }}{{ site.Title }}{{ else }}{{ .Title }} — {{ site.Title }}{{ end }}">
<meta property="og:description"
	content="{{ with .Description }}{{ . }}{{ else }}{{ if .IsPage }}{{ .Summary | plainify | truncate 160 }}{{ else }}{{ site.Params.description }}{{ end }}{{ end }}">

{{- if .Params.cover.image -}}
<meta property="og:image" content="{{ .Params.cover.image | absURL }}">
{{- else if .Resources.GetMatch "cover.*" -}}
<meta property="og:image" content="{{ (.Resources.GetMatch " cover.*").Permalink }}">
{{- else -}}
<meta property="og:image" content="{{ " images/og-card.png" | absURL }}">
{{- end -}}

<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{ .Title }}">
<meta name="twitter:description" content="{{ .Description | default .Summary | truncate 160 }}">
